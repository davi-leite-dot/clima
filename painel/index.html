<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Painel OFI Clima</title>
<meta property="og:type" content="website"><meta property="og:site_name" content="EON · OFI Clima"><meta property="og:title" content="Painel OFI Clima · Fazenda Monte Pascoal"><meta property="og:description" content="Estação da fazenda, previsões de 30 dias, sazonal, El Niño e Weather Pepper. Acesso com senha."><meta property="og:image" content="https://davi-leite-dot.github.io/clima/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta property="og:url" content="https://davi-leite-dot.github.io/clima/"><meta name="twitter:card" content="summary_large_image"><link rel="icon" type="image/png" href="https://davi-leite-dot.github.io/clima/icon.png"><link rel="apple-touch-icon" href="https://davi-leite-dot.github.io/clima/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#F5F2EA;--card:rgba(252,250,245,.86);--line:rgba(20,35,28,.13);--fg:#14231C;--soft:#3E4C44;--muted:#6F786E;--terra:#E25822;--bad:#BF4527;--field:#FFFDF8;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 "IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;min-height:100vh;display:grid;grid-template-columns:minmax(0,420px);justify-content:center;align-content:center;padding:24px 16px;
background-image:radial-gradient(1200px 600px at 85% -10%,rgba(226,88,34,.13),transparent 60%),radial-gradient(900px 500px at -10% 110%,rgba(47,122,74,.14),transparent 60%)}
[hidden]{display:none!important}
.card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 30px 28px;backdrop-filter:blur(14px);box-shadow:0 20px 60px -30px rgba(20,35,28,.35)}
.mark{display:flex;align-items:center;gap:10px;margin-bottom:22px}.mark svg{width:38px;height:38px;flex:none}
.eyebrow{margin:0;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:34px;line-height:1.08;margin:0 0 10px;letter-spacing:-.01em}h1 em{font-style:italic;color:var(--terra)}
.lede{margin:0 0 24px;color:var(--soft);font-size:14.5px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin-bottom:7px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg);outline:none}
input:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(226,88,34,.18)}
button{font:inherit;font-weight:600;padding:12px 18px;border-radius:12px;border:0;background:var(--terra);color:#fff;cursor:pointer}
.err{margin:12px 0 0;color:var(--bad);font-size:13.5px;font-weight:500}
.foot{margin:22px 0 0;font-size:12px;color:var(--muted)}
.wait{text-align:center;color:var(--muted);font-size:13px}
</style>
</head><body>
<main class="card" id="cv" hidden>
  <div class="mark"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="rgba(226,88,34,.12)"/><circle cx="16" cy="16" r="5.5" fill="#E2A127"/><path d="M13 29h14a5.5 5.5 0 0 0 0-11 7.6 7.6 0 0 0-14.4 2.2A4.4 4.4 0 0 0 13 29z" fill="#FCFAF5" stroke="#14231C" stroke-width="1.6" stroke-linejoin="round"/></svg>
  <p class="eyebrow">OFI · Fazenda Monte Pascoal</p></div>
  <h1>Painel <em>OFI Clima</em></h1>
  <p class="lede">Estação da fazenda, previsões, Weather Pepper, El Niño e voo de drone.</p>
  <form id="f" autocomplete="on">
    <input type="text" name="username" value="ofi-clima" autocomplete="username" hidden>
    <label for="pw">Senha de acesso</label>
    <div class="row"><input id="pw" name="pw" type="password" autocomplete="current-password" required autofocus><button type="submit" id="go">Entrar</button></div>
    <p class="err" id="err" role="alert" hidden>Senha incorreta. Tente de novo.</p>
  </form>
  <p class="foot">Dados de 06/11 às 11h26 (Brasília). Acesso restrito · o navegador lembra a senha por 30 dias.</p>
</main>
<p class="wait" id="wait">Abrindo…</p>
<script>
(function(){var R="../";
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function t64(u){var s='';u=new Uint8Array(u);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function stored(){try{var o=JSON.parse(localStorage.getItem('ofi_k')||'null');if(o&&o.exp>Date.now())return o.k}catch(e){}return null}
async function dec(k,buf){var u=new Uint8Array(buf);var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},k,u.slice(12));
 return await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
async function open(raw){var k=await crypto.subtle.importKey('raw',b64(raw),'AES-GCM',false,['decrypt']);
 var r=await fetch('page.enc',{cache:'no-cache'});if(!r.ok)throw new Error('página '+r.status);var html=await dec(k,await r.arrayBuffer());
 document.open();document.write(html);document.close()}
function cover(){document.getElementById('wait').hidden=true;var c=document.getElementById('cv');c.hidden=false;document.getElementById('pw').focus()}
document.getElementById('f').addEventListener('submit',async function(e){e.preventDefault();var b=document.getElementById('go');b.disabled=true;b.textContent='…';
 document.getElementById('err').hidden=true;
 try{var m=await (await fetch(R+'k.json',{cache:'no-cache'})).json();var pw=document.getElementById('pw').value.trim().toLowerCase();
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(m.salt),iterations:m.iter},base,256);
  var k=await crypto.subtle.importKey('raw',bits,'AES-GCM',false,['decrypt']);
  var t=await dec(k,b64(m.check));if(t!=='ok')throw 0;
  var raw=t64(bits);try{localStorage.setItem('ofi_k',JSON.stringify({k:raw,exp:Date.now()+30*864e5}))}catch(_){}
  await open(raw)}catch(err){document.getElementById('err').hidden=false;b.disabled=false;b.textContent='Entrar';document.getElementById('pw').select()}});
var raw=stored();if(raw){open(raw).catch(function(){try{localStorage.removeItem('ofi_k')}catch(_){}cover()})}else cover();
})();
</script>
</body></html>
